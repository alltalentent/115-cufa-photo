<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>系服領取系統</title>
  <style>
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f5f6f8;color:#222}
    button,input{font:inherit}
    button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
    .container{width:min(100%,680px);margin:0 auto;padding:28px 16px 48px}
    h1{margin:0 0 22px;font-size:28px}
    .card{background:#fff;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 3px 16px rgba(0,0,0,.06)}
    .login-wrap{margin-top:10vh}
    label{display:block;margin-bottom:7px;font-weight:800}
    input{width:100%;height:54px;padding:0 14px;border:1px solid #d7dbe0;border-radius:10px;background:#fff;font-size:18px;outline:none}
    .btn{width:100%;min-height:56px;padding:0 16px;border:0;border-radius:10px;background:#111;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
    .btn.secondary{background:#e9ebee;color:#222}
    .btn.success{background:#157347}
    .btn.danger{background:#b42318}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .hidden{display:none!important}
    .error{margin-top:12px;padding:12px 14px;border-radius:9px;background:#fff0f0;color:#b42318;font-weight:700}
    .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .top-row h1{margin:0}
    .logout{width:auto;min-height:44px;font-size:15px;padding:0 14px}
    .search-row{display:grid;grid-template-columns:1fr 120px;gap:10px}
    .search-row .btn{min-height:54px}
    .student-card{border:1px solid #e0e3e6;border-radius:13px;padding:18px;margin-top:14px}
    .name{font-size:26px;font-weight:900;margin-bottom:12px}
    .info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .info-item{background:#f7f8f9;border-radius:10px;padding:11px 12px}
    .info-label{font-size:13px;color:#777;margin-bottom:2px}
    .info-value{font-size:18px;font-weight:800;word-break:break-word}
    .status-bar{margin-top:14px;padding:14px;border-radius:10px;font-weight:800}
    .status-paid{background:#edf8f2;color:#157347}
    .status-unpaid{background:#fff3e8;color:#9a4d00}
    .received{background:#edf8f2;color:#157347}
    .not-received{background:#f1f2f3;color:#333}
    .action{margin-top:14px}
    .candidate{width:100%;text-align:left;border:1px solid #e0e3e6;background:#fff;color:#222;border-radius:11px;padding:14px;margin-top:10px;cursor:pointer}
    .candidate strong{display:block;font-size:18px}
    .candidate small{color:#666}
    .hint{color:#666;font-size:14px;margin-top:9px}
    @media(max-width:600px){
      .container{padding:18px 12px 34px}
      h1{font-size:24px}
      .card{padding:16px}
      .search-row{grid-template-columns:1fr}
      .info-grid{grid-template-columns:1fr 1fr}
      .name{font-size:24px}
    }
  </style>
</head>
<body>
  <div id="loginPage" class="container">
    <div class="card login-wrap">
      <h1>系服領取系統</h1>
      <label for="passwordInput">管理密碼</label>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="請輸入管理密碼">
      <button id="loginBtn" class="btn" type="button" style="margin-top:12px">登入</button>
      <div id="loginError" class="error hidden"></div>
    </div>
  </div>

  <main id="pickupPage" class="container hidden">
    <div class="top-row">
      <h1>系服領取系統</h1>
      <button id="logoutBtn" class="btn secondary logout" type="button">登出</button>
    </div>

    <section class="card">
      <label for="queryInput">學號</label>
      <div class="search-row">
        <input id="queryInput" type="text" autocomplete="off" placeholder="請輸入學號">
        <button id="searchBtn" class="btn" type="button">查詢</button>
      </div>
      
      <div id="searchError" class="error hidden"></div>
      <div id="resultArea"></div>
    </section>
  </main>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycby2mbLVPRt51qYD12ibSuXWsD8idyPTiWqHVbH9Iz2Hdlhdwj8PwcIAH_AgTBC5xXc/exec';
    let adminPassword='';
    let currentQuery='';
    
    let searchLoading=false;
    let syncLoading=false;

    const $=id=>document.getElementById(id);

    async function api(action,data={}){
      const r=await fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action,...data})
      });
      if(!r.ok)throw new Error('系統連線失敗');
      return JSON.parse(await r.text());
    }

    function esc(v){
      return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showError(msg){
      $('searchError').textContent=msg;
      $('searchError').classList.remove('hidden');
    }

    function clearError(){
      $('searchError').textContent='';
      $('searchError').classList.add('hidden');
    }

    async function login(){
      const password=String($('passwordInput').value||'');
      if(!password){
        $('loginError').textContent='請輸入管理密碼';
        $('loginError').classList.remove('hidden');
        return;
      }
      $('loginBtn').disabled=true;$('loginBtn').textContent='登入中...';
      try{
        const r=await api('checkAdminPassword',{password});
        if(!r.success)throw new Error(r.message||'登入失敗');
        adminPassword=password;
        $('loginPage').classList.add('hidden');
        $('pickupPage').classList.remove('hidden');
        setTimeout(()=>$('queryInput').focus(),100);
      }catch(e){
        $('loginError').textContent=e.message||'登入失敗';
        $('loginError').classList.remove('hidden');
      }finally{
        $('loginBtn').disabled=false;$('loginBtn').textContent='登入';
      }
    }

    function logout(){
      adminPassword='';currentQuery='';
      $('passwordInput').value='';$('queryInput').value='';$('resultArea').innerHTML='';
      $('pickupPage').classList.add('hidden');$('loginPage').classList.remove('hidden');
    }

    async function searchStudent(queryOverride=null, silent=false){
      if(searchLoading||!adminPassword)return;
      const query=queryOverride!==null?queryOverride:String($('queryInput').value||'').trim();
      if(!query){
        if(!silent)showError('請輸入學號');
        return;
      }

      searchLoading=true;
      if(!silent){
        $('searchBtn').disabled=true;$('searchBtn').textContent='查詢中...';clearError();
      }

      try{
        const r=await api('findPickupStudent',{password:adminPassword,query});
        if(!r.success)throw new Error(r.message||'查詢失敗');

        currentQuery=query;
        const matches=r.matches||[];

        if(!matches.length) throw new Error('查無已登記的學生');
        renderStudent(matches[0]);
      }catch(e){
        $('resultArea').innerHTML='';
        if(!silent)showError(e.message||'查詢失敗');
      }finally{
        searchLoading=false;
        if(!silent){$('searchBtn').disabled=false;$('searchBtn').textContent='查詢'}
      }
    }


    function renderStudent(s){
      const paidText=s.paid?'已繳費':'尚未繳費';
      const receivedText=s.received?'已領取':'尚未領取';

      $('resultArea').innerHTML=`
        <div class="student-card">
          <div class="name">${esc(s.name)}</div>
          <div class="info-grid">
            <div class="info-item"><div class="info-label">學號</div><div class="info-value">${esc(s.studentId)}</div></div>
            <div class="info-item"><div class="info-label">班級</div><div class="info-value">${esc(s.className)}</div></div>
            <div class="info-item"><div class="info-label">尺寸</div><div class="info-value">${esc(s.size)}</div></div>
            <div class="info-item"><div class="info-label">領取狀態</div><div class="info-value">${receivedText}</div></div>
          </div>
          <div class="status-bar ${s.paid?'status-paid':'status-unpaid'}">${paidText}</div>
          <div class="status-bar ${s.received?'received':'not-received'}">${receivedText}${s.receivedAt?'｜'+esc(s.receivedAt):''}</div>
          <div class="action">
            <button id="receiveBtn" class="btn ${s.received?'danger':'success'}" type="button">
              ${s.received?'取消領取紀錄':'確認已領取'}
            </button>
          </div>
        </div>`;

      $('receiveBtn').addEventListener('click',()=>setReceived(s.studentId,!s.received));
    }

    async function setReceived(studentId,received){
      const btn=$('receiveBtn');
      if(btn)btn.disabled=true;
      try{
        const r=await api('markReceived',{password:adminPassword,studentId,received});
        if(!r.success)throw new Error(r.message||'更新失敗');
        await searchStudent(currentQuery,true);
      }catch(e){
        alert(e.message||'更新失敗');
      }finally{
        const b=$('receiveBtn');if(b)b.disabled=false;
      }
    }

    async function syncCurrent(){
      if(!adminPassword||!currentQuery||syncLoading||searchLoading)return;
      syncLoading=true;
      try{await searchStudent(currentQuery,true)}finally{syncLoading=false}
    }

    $('loginBtn').addEventListener('click',login);
    $('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});
    $('logoutBtn').addEventListener('click',logout);
    $('searchBtn').addEventListener('click',()=>searchStudent());
    $('queryInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchStudent()}});

    setInterval(syncCurrent,1000);
  </script>
</body>
</html>
