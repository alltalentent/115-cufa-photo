<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUFA PHOTO CONTROL</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#10141c;color:#f5f7fb;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(600px,calc(100% - 48px));padding:24px}button{background:#5d87ff;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-size:16px;cursor:pointer}pre{background:#1c2532;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px}small{color:#b7c3d3}</style></head><body><main><h1>CUFA PHOTO CONTROL</h1><p>第二階段｜Apps Script 內部連線診斷</p><small>不讀取、不修改任何學生資料</small><p><button id="test">測試 google.script.run</button></p><pre id="result">尚未測試</pre></main><script>document.getElementById('test').onclick=function(){const btn=this,output=document.getElementById('result');btn.disabled=true;output.textContent='測試中…';google.script.run.withSuccessHandler(function(data){output.textContent=JSON.stringify(data,null,2);btn.disabled=false}).withFailureHandler(function(error){output.textContent='連線失敗：'+error.message;btn.disabled=false}).ping()};</script></body></html>
