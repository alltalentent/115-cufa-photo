<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUFA PHOTO CONTROL</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#10141c;color:#f5f7fb;margin:0}main{max-width:1050px;margin:auto;padding:24px}input,button{padding:12px;border-radius:8px;font:inherit}button{background:#638aff;color:white;border:0;cursor:pointer}input{background:#202938;color:white;border:1px solid #546070}section{background:#1b2430;padding:18px;border-radius:12px;margin:16px 0}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #394556;text-align:left}th{color:#b9c7d9}#status{white-space:pre-wrap;color:#cbd6e7}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats section{min-width:125px}small{color:#a9b8cc}</style></head><body><main><h1>CUFA PHOTO CONTROL</h1><small>第三階段｜Google Sheets 唯讀總覽｜不會修改任何資料</small><section><label>管理密碼 <input id="password" type="password" autocomplete="off"></label> <button id="load">讀取資料</button><p id="status">尚未登入</p></section><div id="dashboard" hidden><div class="stats" id="stats"></div><section><h2>拍攝流程</h2><div id="schedule"></div></section><section><h2>學生名單（最多顯示 150 筆）</h2><div id="people"></div></section></div></main><script>
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(rows,fields){return '<div style="overflow:auto"><table><thead><tr>'+fields.map(f=>'<th>'+esc(f[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+fields.map(f=>'<td>'+esc(r[f[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
el('load').onclick=()=>{const pass=el('password').value;if(!pass){el('status').textContent='請輸入管理密碼';return}el('load').disabled=true;el('status').textContent='正在讀取 Google Sheets…';google.script.run.withSuccessHandler(d=>{el('password').value='';el('status').textContent='已成功讀取 '+d.version+'（唯讀）';el('dashboard').hidden=false;el('stats').innerHTML=[['學生',d.people.length],['拍攝任務',d.tasks.length],['流程',d.schedule.length],['報到',d.checkins.length]].map(([k,v])=>'<section><small>'+k+'</small><h2>'+v+'</h2></section>').join('');el('schedule').innerHTML=table(d.schedule,[['start','開始'],['end','結束'],['title','內容'],['kind','類型']]);el('people').innerHTML=table(d.people.slice(0,150),[['studentId','學號'],['name','姓名'],['class','班級'],['checkInStatus','報到狀態']]);el('load').disabled=false}).withFailureHandler(e=>{el('status').textContent='讀取失敗：'+e.message;el('load').disabled=false}).getDashboard(pass)};
</script></body></html>
