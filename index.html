<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUFA PHOTO CONTROL</title><script src="./config.js"></script>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#20242a;color:#f6f4ef;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}.panel{max-width:680px;width:100%;background:#2b323a;border:1px solid #48515c;border-radius:18px;padding:clamp(24px,5vw,46px)}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.muted{color:#bdc6cd}.button{display:block;text-align:center;background:#f6f4ef;color:#20242a;padding:16px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:26px}.button[hidden]{display:none}.notice{margin-top:20px;border-top:1px solid #48515c;padding-top:16px;font-size:14px;color:#d2d9de}code{overflow-wrap:anywhere}</style></head>
<body><main class="panel"><div class="muted">崇右影藝科技大學 · 2026.11.03 · A104</div><h1>CUFA PHOTO CONTROL</h1><p class="muted">拍攝總控台 · 報到管理 · 叫號畫面 · 電子試鏡單</p><p>本入口不公開學生資料。請由已授權的校內 Google 帳號開啟工作系統。</p><a id="launch" class="button" hidden rel="noopener noreferrer">進入拍攝管理系統</a><div id="status" class="notice" role="status">正在確認系統入口設定…</div></main>
<script>'use strict';const url=window.CUFA_CONFIG?.appsScriptUrl||'';const a=document.getElementById('launch'),status=document.getElementById('status');if(/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec(?:[?#].*)?$/.test(url)){a.href=url;a.hidden=false;status.textContent='系統透過 Google Apps Script 執行；存取權限由 Google 帳號與工作人員名單控制。'}else{status.textContent='管理系統尚未設定正式 Apps Script /exec 網址。網站入口已建立，但尚未開放登入。';}</script></body></html>
