<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUFA PHOTO CONTROL</title><script src="./config.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui,-apple-system,sans-serif;background:#20242a;color:#f6f4ef;margin:0}header{padding:18px 24px;border-bottom:1px solid #4b5660;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}main{max-width:1280px;margin:auto;padding:18px}nav{display:flex;flex-wrap:wrap;gap:8px}button{background:#3d4955;color:#f6f4ef;border:1px solid #667482;border-radius:9px;padding:11px 14px;cursor:pointer}button:hover{background:#536270}button:disabled{opacity:.4;cursor:not-allowed}section{background:#2b323a;border-radius:14px;padding:20px;margin-top:16px}input,textarea{font:inherit;background:#f6f4ef;color:#20242a;border:0;border-radius:7px;padding:10px;max-width:100%}.row{border-bottom:1px solid #49545e;padding:12px 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.small{font-size:13px;color:#b8c1ca}.big{font-size:clamp(38px,7vw,92px);font-weight:750}.slate{text-align:center;padding:48px 12px}.error{color:#ffc3aa}.success{color:#9be2bf}.stack{display:flex;flex-direction:column;gap:8px}.wrap{display:flex;flex-wrap:wrap;gap:6px}.note{max-width:280px}.stats{display:flex;gap:20px;flex-wrap:wrap}label{display:inline-flex;align-items:center;gap:4px;font-size:13px;margin-right:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>
<header><h1>CUFA PHOTO CONTROL <span class="small">2026.11.03 · A104</span></h1><div id="auth"><span class="small">登入中…</span></div></header><main><nav id="nav" hidden><button data-page="control">總控台</button><button data-page="checkin">報到區</button><button data-page="queue">叫號畫面</button><button data-page="slate">電子試鏡單</button><button data-page="schedule">拍攝流程</button><button id="refresh">重新整理</button></nav><p id="message" class="small" role="status"></p><section id="view"><h2>正在確認安全連線</h2></section></main>
<script>
'use strict';
const cfg=window.CUFA_CONFIG||{},state={password:null,people:[],tasks:[],schedule:[],live:{},page:'control'};
const $=id=>document.getElementById(id),make=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text??'';if(cls)n.className=cls;return n};
function message(s,error=false){$('message').textContent=s;$('message').className=error?'error':'small'}
function button(text,handler){const b=make('button',text);b.onclick=handler;return b}
async function request(path,body){if(!state.password)throw Error('請先登入');const payload={password:state.password,...(body||{action:'dashboard'})};let r;try{r=await fetch(cfg.appsScriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',cache:'no-store'})}catch(e){throw Error('Apps Script 連線失敗（可能是跨網域限制、部署權限或網路問題）；請檢查瀏覽器 Console 與 /exec 部署。原始錯誤：'+e.message)}if(!r.ok)throw Error('Apps Script HTTP '+r.status);let response;try{response=await r.json()}catch(e){throw Error('Apps Script 回傳內容不是 JSON；請確認 /exec 指向最新版 doPost。')}if(!response.ok)throw Error(response.error||'API request rejected');return response.data}

let loading=false;async function load(){if(loading)return;loading=true;try{const x=await request('/api/dashboard');Object.assign(state,x);message('已同步資料');render()}catch(e){message(e.message,true)}finally{loading=false}}
let writing=false;async function action(payload){if(writing)return;if(!confirm('確定執行此操作？將更新正式 Google Sheets。'))return;writing=true;try{await request('/api/action',payload);await load()}catch(e){message(e.message,true)}finally{writing=false}}
function page(name){state.page=name;render()}
function render(){const root=$('view');root.replaceChildren();const p=state.people,t=state.tasks,l=state.live;
if(state.page==='queue'){const x=p.find(x=>x.personId===l.calledPersonId);const upcoming=p.filter(z=>z.queueNo&&z.personId!==l.calledPersonId&&!(t.filter(q=>q.personId===z.personId).length&&t.filter(q=>q.personId===z.personId).every(q=>q.status==='已完成'))).sort((a,b)=>Number(String(a.queueNo).replace(/\D/g,''))-Number(String(b.queueNo).replace(/\D/g,'')));root.append(make('div','NOW CALLING','small'),make('div',x?x.name:'等待叫號','big'),make('div',x?x.queueNo:'','big'),make('h2','NEXT'));upcoming.slice(0,3).forEach(z=>root.append(make('div',z.queueNo+' · '+z.name,'row')));return}
if(state.page==='slate'){const x=p.find(x=>x.personId===l.slatePersonId);const slate=make('div','','slate');slate.append(make('div','DIGITAL SLATE','small'),make('div',x?(x.studentId||'—'):'等待開始拍攝','big'));if(x)slate.append(make('div',x.name,'big'),make('div',x.class+' · '+x.queueNo+' · '+x.shootTypes,'small'),make('div','身高 '+(x.heightCm||'—')+' cm · 體重 '+(x.weightKg||'—')+' kg · 電話 '+(x.phone||'—'),'small'));root.append(slate);return}
if(state.page==='schedule'){root.append(make('h2','拍攝流程'));state.schedule.forEach(x=>root.append(make('div',(x.start||x.startTime||'—')+'–'+(x.end||x.endTime||'—')+'  '+(x.title||x.class||x.activity||''),'row')));return}
if(state.page==='checkin'){root.append(make('h2','報到區'));const search=make('input');search.placeholder='搜尋姓名、學號或班級';search.setAttribute('aria-label','搜尋報到學生');root.append(search);const list=make('div');root.append(list);function draw(){list.replaceChildren();p.filter(x=>[x.name,x.studentId,x.class].join(' ').includes(search.value)).forEach(x=>{const row=make('div','','row');row.append(make('span',x.name+' · '+x.class+' · '+(x.queueNo||'未報到')));if(!x.queueNo)row.append(button('核對肖像同意並報到',()=>{if(confirm('已實際核對本人及肖像同意文件？'))action({action:'checkIn',personId:x.personId,consentStatus:'已確認'})}));list.append(row)})}search.oninput=draw;draw();return}
root.append(make('h2','拍攝總控台'));const current=p.find(x=>x.personId===l.activePersonId);root.append(make('p','目前拍攝：'+(current?current.name:'無')));const stats=make('div','','stats');stats.append(make('span','已報到 '+p.filter(x=>x.queueNo).length+'/'+p.length),make('span','已完成 '+t.filter(x=>x.status==='已完成').length+'/'+t.length));root.append(stats);const classes=[...new Set(p.map(x=>x.class).filter(Boolean))].sort();const summary=make('details');const heading=make('summary','各班報到與拍攝進度');summary.append(heading);classes.forEach(cls=>{const students=p.filter(x=>x.class===cls),ids=new Set(students.map(x=>x.personId)),classTasks=t.filter(x=>ids.has(x.personId));summary.append(make('div',cls+'｜報到 '+students.filter(x=>x.queueNo).length+'/'+students.length+'｜完成 '+classTasks.filter(x=>x.status==='已完成').length+'/'+classTasks.length,'row'))});root.append(summary);root.append(button('結束目前拍攝（保留電子試鏡單）',()=>action({action:'finish'})));
p.filter(x=>x.queueNo).forEach(x=>{const row=make('div','','row'),info=make('div',x.queueNo+' · '+x.name+' · '+x.class),controls=make('div','','stack'),actions=make('div','','wrap');actions.append(button('叫號',()=>action({action:'call',personId:x.personId})),button('開始拍攝',()=>action({action:'start',personId:x.personId})));controls.append(actions);
t.filter(z=>z.personId===x.personId).forEach(z=>{const box=make('div','','stack');box.append(make('strong',z.shootType+' · '+z.status));const checked=new Set((z.checkedItems||'').split('／').filter(Boolean));(z.checklist||'').split('／').filter(Boolean).forEach(item=>{const label=make('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=checked.has(item);cb.onchange=()=>cb.checked?checked.add(item):checked.delete(item);label.append(cb,document.createTextNode(item));box.append(label)});const note=make('input');note.className='note';note.placeholder='備註';note.value=z.notes||'';box.append(note);const ops=make('div','','wrap');for(const [caption,status] of [['儲存',''+(z.status||'待拍攝')],['完成','已完成'],['需補拍','需補拍'],['缺席','缺席']])ops.append(button(caption,()=>action({action:'task',taskId:z.taskId,status,notes:note.value,checkedItems:[...checked].join('／')})));box.append(ops);controls.append(box)});row.append(info,controls);root.append(row)});
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));$('refresh').onclick=load;
function setup(){
 if(!cfg.appsScriptUrl){message('尚未設定 Apps Script 網址',true);return}
 $('auth').replaceChildren();
 const field=make('input');field.type='password';field.placeholder='管理密碼';field.autocomplete='current-password';field.setAttribute('aria-label','管理密碼');
 const login=button('登入',async()=>{state.password=field.value;field.value='';try{await request('',{action:'checkAdminPassword'});$('auth').replaceChildren(button('登出',()=>{state.password=null;$('nav').hidden=true;$('view').replaceChildren(make('h2','已登出'));setup()}));$('nav').hidden=false;await load()}catch(e){state.password=null;message(e.message,true)}});
 field.onkeydown=e=>{if(e.key==='Enter')login.click()};
 $('auth').append(field,login);
 $('view').replaceChildren(make('h2','工作人員登入'),make('p','請輸入管理密碼'));
 message('請輸入管理密碼');
}

setup();setInterval(()=>{if(state.password&&['queue','slate'].includes(state.page))load()},5000);
</script></body></html>
